blueprint:
  id: wax-organic-activity-fingerprinter
  name: Organic Activity Fingerprinter
  tier: forensics-behavioral
  category: analytics
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-18"

metadata:
  description: |
    Pure timing-interval statistics and a heuristic Humanity Certainty Index
    for WAX action histories. Educational — not identity verification.
  related_blueprints:
    - wax-temporal-behavior-heatmap
    - wax-funding-trail-lineage-graph

invariants:
  - Core math is pure and deterministic
  - HCI labeled heuristic only
  - Small samples and near-zero variance emit flags
  - Must not present random scores as analysis

features:
  implemented:
    - computeIntervals, computeIntervalStats, fingerprintTimestamps
    - CertaintyGauge, StatsPanel, FlagsList, demo
    - app page wired to real engines

machine_instructions:
  - Use examples/engines.ts — never Math.random for HCI
  - Feed Hyperion timestamps at the app edge only
  - Always surface disclaimer: not ban-grade alone

technical_requirements:
  framework: Next.js + TypeScript
  styling: Tailwind CSS
  data: Hyperion history (production)
